<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>camref scene</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;margin:0 auto;height:100vh !important;width:auto !important}/* display size only; frames stay 720x1280 */</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { PRESETS, DEFAULT_PRESET } from './presets.js';

// ---- settings (edit these, re-render) ---------------------------------
const W = 720, H = 1280;          // 9:16, same as the wan3 clips
const FOV = 55;                   // default vertical field of view, degrees (a key's own fov overrides it)
// The camera path comes from presets.js: scene.html?preset=<name> (default: low_angle_rise).
// To add or change a move, edit presets.js, not this file.
const params = new URLSearchParams(location.search);
const PRESET = PRESETS[params.get('preset')] ? params.get('preset') : DEFAULT_PRESET;
const KEYS = PRESETS[PRESET].keys;
const DURATION = KEYS[KEYS.length - 1].t;   // seconds
// -----------------------------------------------------------------------

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaeb4bc);
scene.fog = new THREE.Fog(0xaeb4bc, 8, 26);

scene.add(new THREE.HemisphereLight(0xffffff, 0x5a5f68, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(-2.5, 5, 3);
scene.add(sun);

const mat = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85 });

// --- the "person": upright rectangle + circle -------------------------
const person = new THREE.Group();
const body = new THREE.Mesh(new THREE.BoxGeometry(0.46, 1.42, 0.26), mat(0x6f7885));
body.position.y = 0.71;
const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.06, 0.1, 20), mat(0xc9b9a6));
neck.position.y = 1.46;
const head = new THREE.Mesh(new THREE.SphereGeometry(0.14, 48, 32), mat(0xd9c8b4));
head.position.y = 1.62;
// tiny face marks so the model can tell which way the head faces
const dark = mat(0x1b1d21);
const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.017, 16, 12), dark);
eyeL.position.set(-0.05, 1.645, 0.128);
const eyeR = eyeL.clone(); eyeR.position.x = 0.05;
const nose = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.04, 0.03), mat(0xc4b19c));
nose.position.set(0, 1.605, 0.142);
person.add(body, neck, head, eyeL, eyeR, nose);
scene.add(person);

// --- surroundings: things for the model to read the camera move from ---
const grid = new THREE.GridHelper(40, 80, 0x3d434c, 0x7d848e);
scene.add(grid);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), mat(0x969ca6));
floor.rotation.x = -Math.PI / 2; floor.position.y = -0.002;
scene.add(floor);
// tall pillars at different depths behind the person (parallax as the camera rises)
// A preset with props:false (or ?props=0) leaves them out: in wide moves such as orbits the model copies them.
const PROPS = PRESETS[PRESET].props !== false && params.get('props') !== '0';
const pillars = [[-1.6, -1.5], [1.7, -2.2], [-2.6, -4.5], [2.9, -5.5], [-0.9, -7.5], [1.1, -9.5], [-4.2, -8], [4.6, -10]];
for (const [x, z] of PROPS ? pillars : []) {
  const p = new THREE.Mesh(new THREE.BoxGeometry(0.45, 7, 0.45), mat(0x878e99));
  p.position.set(x, 3.5, z);
  scene.add(p);
}
// overhead beams: visible when the camera looks up, so the tilt is readable
for (const z of PROPS ? [-1, -3.5, -6, -8.5] : []) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(14, 0.25, 0.35), mat(0x7a818c));
  b.position.set(0, 5.2, z);
  scene.add(b);
}

const camera = new THREE.PerspectiveCamera(FOV, W / H, 0.05, 60);

const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const mix = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);

function renderAt(t) {
  t = Math.max(0, Math.min(DURATION, t));
  let i = 0;
  while (i < KEYS.length - 2 && t > KEYS[i + 1].t) i++;
  const a = KEYS[i], b = KEYS[i + 1];
  const x = (t - a.t) / (b.t - a.t);
  const k = b.ease === 'linear' ? x : ease(x);   // per-key: ease:'linear' for multi-key paths (orbits)
  camera.position.set(...mix(a.pos, b.pos, k));
  // optional per-key lens and roll: fov (vertical degrees, default FOV), roll (degrees, dutch angle)
  const fa = a.fov ?? FOV, fb = b.fov ?? FOV;
  camera.fov = fa + (fb - fa) * k;
  camera.updateProjectionMatrix();
  camera.lookAt(...mix(a.look, b.look, k));
  const ra = a.roll ?? 0, rb = b.roll ?? 0;
  camera.rotateZ(((ra + (rb - ra) * k) * Math.PI) / 180);
  renderer.render(scene, camera);
}

window.CAMREF = { W, H, DURATION, renderAt, preset: PRESET,
  presets: Object.fromEntries(Object.entries(PRESETS).map(([k, v]) => [k, { group: v.group, label: v.label }])), frame: (t) => { renderAt(t); return renderer.domElement.toDataURL('image/png'); } };

// live preview when opened in a normal browser
if (!params.has('capture')) {
  const t0 = performance.now();
  const loop = () => { renderAt(((performance.now() - t0) / 1000) % (DURATION + 1)); requestAnimationFrame(loop); };
  loop();
} else {
  renderAt(0);
}
window.CAMREF_READY = true;
</script>
</body>
</html>
